<script>
let score = 10;              // 10
score += 5;                  // 15 
score *= 2;                  // 30
let bonus = score % 7;       // 2
score -= bonus;              // 28
let old = ++score;           // 29
let next = ++score;          // 30
score /= 3;                  // 10 
bonus--;                     // 1
score = score + bonus * 4;   // 14
