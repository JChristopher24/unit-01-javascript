<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let grade = Number(prompt("Enter your test score:"));
        // You need to use Number() because prompt() returns a string.

        if (grade >= 90) {
            alert("You got an A!");
        } else if (grade >= 80) {
            alert("You got a B!");
        } else if (grade >= 70) {
            alert("You got a C!");
        } else if (grade >= 60) {
            alert("You got a D!");
        } else {
            alert("You got an F!");
        }

    /*
    TEST RESULTS - Letter Grade Converter
    Test score | Expected | Your output
    -----------|----------|------------
    90         | A        | A
    89         | B        | B
    60         | D        | D
    59         | F        | F
    100        | A        | A
    */
        
    </script>

</body>
</html>
