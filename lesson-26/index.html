<!DOCTYPE html>
<html>
    <head>
    <title>Arcade Controls</title>
    <style>
        .card { border: 2px solid purple; padding: 8px; width: 200px; margin: 6px 0; }
        .glow { background-color: gold; }
        #player { position: relative; width: 40px; height: 40px; background-color: purple; }
    </style>
    </head>
    <body>
    <h1>Arcade Controls</h1>
    <p id="score">Score: 0</p>
    <button id="point">+1 Point</button>
    <button id="reset">Reset</button>
    <button id="help" onclick="showHelp()">Help</button>
    <p id="status">Press Help for instructions</p>
    <div id="prize" class="card">Hover for the prize</div>
    <div class="card game">Pinball</div>
    <div class="card game">Air Hockey</div>
    <div class="card game">Skee-Ball</div>
    <h2>High Scores</h2>
    <ul id="highScores"></ul>
    <div id="player"></div>
    
    <script>
        let score = 0;
        let x = 0;
        let scoreText = document.getElementById("score");
        let player = document.getElementById("player");
        let topScores = ["Ana: 42", "Kai: 37", "Zoe: 30"];
    
        // Your code goes here
        // Core 1 - keydown, textContent, addEventListener, getElementById

        function addPoint() {
            score++;
            scoreText.textContent = "Score: " + score;
        }

        let pointBtn = document.getElementById("point");
        pointBtn.addEventListener("click", addPoint);

        // Core 2 - textContent, onclick,

        function resetScore() {
            score = 0;
            scoreText.textContent = "Score: " + score;
        }

        let resetBtn = document.getElementById("reset");
        resetBtn.onclick = resetScore;

        // Core 3 - innerHTML, getElementById
        function showHelp() {
            let status = document.getElementById("status");
            status.innerHTML = "Use the <b>arrow keys</b> to move";
        }

        // Core 4 - textContent, className, getElementById, addEventListener

        function showPrize() {
            let prize = document.getElementById("prize");
            prize.textContent = "Prize: 500 tickets";
            prize.className = "card glow";
        }

        function hidePrize() {
            let prize = document.getElementById("prize");
            prize.textContent = "Hover for the prize";
            prize.className = "card";
        }

        let prize = document.getElementById("prize");
        prize.addEventListener("mouseover", showPrize);
        prize.addEventListener("mouseout", hidePrize);

        // Core 5 - createElement, appendChild, setAttribute, getElementById, textContent
        function showHighScores() {
            for (let i = 0; i < topScores.length; i++) {
                let li = document.createElement("li");
                li.textContent = topScores[i];
                li.setAttribute("class", "card");
                document.getElementById("highScores").appendChild(li);
            }
        }

        showHighScores();

        // Stretch 6 - function, switch, style
        function movePlayer(event) {
            switch(event.key) {
                case "ArrowRight":
                    x += 20;
                    break;
                case "ArrowLeft":
                    x -= 20;
                    break;
            }

            player.style.left = x + "px";
        }

        // Stretch 7 - innerWidth, else if

        if (x < 0) {
            x = 0;
        } else if (x > window.innerWidth - 60) {
            x = window.innerWidth - 60;
        }

        document.addEventListener("keydown", movePlayer);

        // Challenge 8 - addEventListener, className, getElementsByClassName, event.target

        function show(event) {
            let game = document.getElementsByClassName("game");
            for (let i = 0; i < game.length; i++) {
                event.target.className = "card game glow";
            }

        }

        function hide(event) {
            let game = document.getElementsByClassName("game");
            for (let i = 0; i < game.length; i++) {
                event.target.className = "card game";
            }
        }

        let game = document.getElementsByClassName("game");

        game[0].addEventListener("mouseover", show);
        game[0].addEventListener("mouseout", hide);

        game[1].addEventListener("mouseover", show);
        game[1].addEventListener("mouseout", hide);

        game[2].addEventListener("mouseover", show);
        game[2].addEventListener("mouseout", hide);

    </script>
    </body>
</html>
