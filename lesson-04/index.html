<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let bill = parseFloat(prompt("What is the Bill?"));

        let tip = parseFloat(prompt("What is the Tip?"));

        let people = parseInt(prompt("How many people are there?"));

        let total = bill * (1 + tip / 100);

        let perPerson = total / people;
        
        alert("Total Bill is " + total.toLocaleString("en-US", { style:"currency", currency: "USD"}))

        alert("Each person should pay " + perPerson.toLocaleString("en-US", { style:"currency", currency: "USD"}))
</script>

</body>
</html>
