<script>
// STEP 1
function Student(name, scores) {
    this.name = name;
    this.scores = scores;
    for (let i = 0; i < this.scores.length; i++) {
        if (isNaN(this.scores[i]) || this.scores[i] < 0 || this.scores[i] > 100) {
            throw new Error("Invalid score for " + name + ": " + this.scores[i]);
        }
    }
    this.getAverage = function() {
        let total = 0;
        for (let i = 0; i < this.scores.length; i++) {
            total += this.scores[i];
        }
        return (total / this.scores.length);
    }
}

// STEP 3

function getLetter(average) {
    if (average >= 90) {
        return "A";
    } else if (average >= 80) {
        return "B";
    } else if (average >= 70) {
        return "C";
    } else if (average >= 60) {
        return "D";
    } else {
        return "F";
    }
}

// STEP 4

function findHighest(list) {
    this.list = list;
    let highestStudent = this.list[0];
    for (let i = 1; i < this.list.length; i++) {
        if (this.list[i].getAverage() > highestStudent.getAverage()) {
            highestStudent = this.list[i];
        }
    }
    return highestStudent;
}

function findLowest(list) {
    this.list = list;
    let lowestStudent = this.list[0];
    for (let i = 1; i < this.list.length; i++) {
        if (this.list[i].getAverage() < lowestStudent.getAverage()) {
            lowestStudent = this.list[i];
        }
    }
    return lowestStudent;
}

// STEP 5

function sortByAverage(list) {
    this.list = list;
    this.list.sort((a, b) => b.getAverage() - a.getAverage());
}

// STEP 6

function printReport(list) {
    this.list = list;
    let today = new Date();
    today = today.toLocaleDateString("en-US");
    console.log("Report for " + today);
    for (let i = 0; i < this.list.length; i++) {
        console.log((i + 1) + ". " + this.list[i].name + ": " + this.list[i].getAverage().toFixed(1));
    }
    console.log(findHighest(this.list).name + " has the highest average of " + findHighest(this.list).getAverage().toFixed(1));
    console.log(findLowest(this.list).name + " has the lowest average of " + findLowest(this.list).getAverage().toFixed(1));
}

sortByAverage(roster);
printReport(roster);
