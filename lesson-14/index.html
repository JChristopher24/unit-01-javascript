<script>
// ---------- Puzzle 1: Same name, different variable ----------
// PREDICTION: 3 2
// ACTUAL: 3 2
// WHY: The  variable lives is 3, and the variable left uses the value from the function loseLife 
console.log("--- Puzzle 1 ---");
let lives = 3;
function loseLife(lives) {
    lives = lives - 1;
    return lives;
}
let left = loseLife(lives);
console.log(lives, left);

// ---------- Puzzle 2: The unchanged score ----------
// PREDICTION: 100 50
// ACTUAL: 100 50
// WHY: The variable score is 50, and the function doubleIt modifies a local copy of the value
console.log("--- Puzzle 2 ---");
let score = 50;
function doubleIt(num) {
    num = num * 2;
    console.log(num);
}
doubleIt(score);
console.log(score);

// ---------- Puzzle 3: The quiet shout ----------
// PREDICTION: dog
// ACTUAL: dog
// WHY: There is no return statement in the shout function, so the function doesn't print a value.
console.log("--- Puzzle 3 ---");
function shout(word) {
    word = word.toUpperCase();
}
let pet = "dog";
shout(pet);
console.log(pet);

// MY FIX: Complete shoutFixed so pet ends up as "DOG"
// without making pet global inside the function. (Hint: return)
function shoutFixed(word) {
    // write your code here
    return word = word.toUpperCase();
}
pet = shoutFixed(pet);
console.log("Puzzle 3 fix:", pet);

// ---------- Puzzle 4: The missing keyword ----------
// PREDICTION: Jordan undefined
// ACTUAL: Jordan undefined
// WHY: The variable playerName is declared without a keyword, so it becomes a global scoped, The variable round is declared with let, so it's block scoped
console.log("--- Puzzle 4 ---");
function startGame() {
    playerName = "Jordan";
    let round = 1;
}
startGame();
console.log(playerName);
console.log(typeof round);

// ===================== STRETCH =====================

// ---------- Puzzle 5: Two functions, one global ----------
// PREDICTION:
// ACTUAL:
// WHY:
console.log("--- Puzzle 5 ---");
let coins = 10;
function spend(amount) {
    coins = coins - amount;
}
function earn(amount) {
    let coins = 100;
    coins = coins + amount;
}
spend(3);
earn(5);
console.log(coins);


</script>
